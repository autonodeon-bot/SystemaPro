name: es_td_ngo_mobile
description: Мобильное приложение инженера диагностики (ЕС ТД НГО)
publish_to: 'none'
version: 3.21.0+21

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State & Routing
  flutter_riverpod: ^3.0.3
  state_notifier: ^1.0.0
  go_router: ^17.0.0
  
  # Forms & UI
  flutter_form_builder: ^10.1.0
  form_builder_validators: ^11.2.0
  form_builder_image_picker: ^4.3.1
  cupertino_icons: ^1.0.6
  
  # HTTP & API
  http: ^1.2.2
  dio: ^5.4.0
  
  # Database (Offline-first)
  sqflite: ^2.3.3+2
  path: ^1.9.0
  path_provider: ^2.1.2
  
  # Utils
  image_picker: ^1.0.7
  file_picker: ^10.3.7
  pdf: ^3.10.7
  printing: ^5.12.0
  image: ^4.3.0
  image_gallery_saver_plus: ^4.0.1
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  flutter_local_notifications: ^17.2.2+1
  workmanager: ^0.9.0+3
  uuid: ^4.5.1
  
  # Bluetooth для интеграции с приборами
  flutter_blue_plus: ^2.0.2
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  package_info_plus: ^8.0.2
  crypto: ^3.0.5
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  open_filex: ^4.5.0
  local_auth: ^2.3.0
  archive: ^3.4.10
  device_info_plus: ^11.1.0
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # isar_generator: ^3.1.0
  build_runner: ^2.4.8

flutter:
  uses-material-design: true





