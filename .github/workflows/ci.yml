name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ─── Backend (Python / FastAPI) ─────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check . --select=E,F,W --ignore=E501

      - name: Type check (mypy)
        continue-on-error: true
        run: |
          pip install mypy types-requests
          mypy main.py shared.py --ignore-missing-imports --no-error-summary || true

      - name: Tests
        run: python -m pytest tests/ -v --tb=short --co -q 2>/dev/null; python -m pytest tests/ -v --tb=short

  # ─── Frontend (React / TypeScript / Vitest) ─────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (TypeScript)
        continue-on-error: true
        run: npx tsc --noEmit || true

      - name: Tests
        run: npm test -- --reporter=verbose

  # ─── Mobile (Flutter / Dart) ────────────────────────────────────────────
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        continue-on-error: true
        run: dart analyze --fatal-infos || true

      - name: Tests
        run: flutter test --reporter expanded

  # ─── Docker build check ────────────────────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build -f frontend.Dockerfile -t sistemapro-frontend:test .

      - name: Verify image
        run: docker images sistemapro-frontend:test
