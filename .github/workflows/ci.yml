name: SystemaPro CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install flake8 mypy
      - name: Lint with flake8
        run: |
          cd backend
          flake8 --max-line-length=150 --exclude=alembic --count --show-source --statistics *.py

  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install -r requirements-test.txt
      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: test
          DB_PASS: test
          DB_NAME: testdb
          JWT_SECRET_KEY: test-secret-key
          CORS_ORIGINS: http://localhost:3000
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short
      - name: Install document converter
        run: sudo apt-get update && sudo apt-get install -y libreoffice-writer fonts-dejavu-core fonts-liberation
      - name: Verify every official report template
        run: |
          cd backend
          python scripts/audit_all_report_forms.py
          python scripts/test_official_form_fillers.py
          python -m unittest discover -s scripts -p test_report_generation_regressions.py

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Frontend tests
        run: npm test
      - name: Build
        run: npm run build

  mobile-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.7'
          channel: 'stable'
      - name: Get dependencies
        run: |
          cd mobile
          flutter pub get
      - name: Analyze
        run: |
          cd mobile
          flutter analyze --no-fatal-infos
      - name: Mobile tests
        run: cd mobile && flutter test
      - name: Build APK
        run: |
          cd mobile
          flutter build apk --debug
