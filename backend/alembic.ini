# Alembic: миграции схемы БД SystemaPro
# Строка подключения НЕ хранится здесь — задаётся в alembic/env.py из переменных
# окружения (как в database.py: DB_* или опционально DATABASE_URL).

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Заглушка; реальный URL подставляется в env.py до создания движка.
sqlalchemy.url = postgresql+asyncpg://127.0.0.1:5432/placeholder

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
