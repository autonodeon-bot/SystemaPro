server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Лимит тела запроса для API (отчёты/обследования с фото могут быть большими)
    client_max_body_size 100m;

    # Отключить ETag для предотвращения кэширования
    etag off;

    # Отключить кэширование для всех файлов по умолчанию
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    # Основной location
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Отключить кэширование для HTML файлов
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Отключить кэширование для JS файлов
    location ~* \.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Отключить кэширование для CSS файлов
    location ~* \.css$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Статические файлы (изображения, шрифты) - можно кэшировать
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Прокси API на backend (веб и мобильное приложение идут через порт 80)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Type $content_type;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        client_max_body_size 100m;
    }

    # Мобильное приложение: раздача APK (каталог монтируется в контейнер как volume)
    location /mobile/ {
        alias /usr/share/nginx/html/mobile/;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        etag off;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;
}
